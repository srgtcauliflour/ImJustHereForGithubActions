name: ProjectOrchid iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DRIVE_FILE_ID: 1vRsZLlwYe-5SOkawJA-bGOnBe6gA56eA
      RENPY_VERSION: 8.5.3
      APP_NAME: ProjectOrchid
      BUNDLE_ID: com.generic.projectorchid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          sw_vers
          df -h

      - name: Restore cached source APK
        id: source-cache
        uses: actions/cache@v4
        with:
          path: source.apk
          key: orchid-source-apk-3d6d711f9111239a8069c6b7a070c1ba3a514a26570f6f689afe51892667e429

      - name: Download source APK on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/orchid-venv"
          "$RUNNER_TEMP/orchid-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/orchid-venv/bin/python" -m pip install gdown
          for attempt in 1 2 3 4; do
            "$RUNNER_TEMP/orchid-venv/bin/python" -m gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O source.apk && break
            echo "Drive download attempt $attempt failed"
            rm -f source.apk
            sleep $((attempt * 15))
          done
          test -s source.apk

      - name: Verify source APK
        run: |
          set -euxo pipefail
          test -s source.apk
          EXPECTED=3d6d711f9111239a8069c6b7a070c1ba3a514a26570f6f689afe51892667e429
          ACTUAL="$(shasum -a 256 source.apk | awk '{print $1}')"
          echo "source.apk SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          ls -lh source.apk

      - name: Recover RenPy game tree
        run: |
          set -euxo pipefail
          rm -rf recovered
          mkdir -p recovered/game
          unzip -q source.apk 'assets/x-game/*' -d apk-extract
          cp -R apk-extract/assets/x-game/. recovered/game/

          # Android's x-* asset packaging prefixes every path component.
          # Restore the original Ren'Py names from the leaves upward.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("recovered/game")
          paths = sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True)
          for p in paths:
              if p.name.startswith("x-"):
                  target = p.with_name(p.name[2:])
                  if target.exists():
                      raise SystemExit(f"Rename collision: {p} -> {target}")
                  p.rename(target)
          PY

          echo "Recovered files:"
          find recovered/game -type f | wc -l
          du -sh recovered/game
          test -f recovered/game/script_version.txt
          cat recovered/game/script_version.txt
          find recovered/game -name '*.rpyc' | head -30

      - name: Download matching RenPy SDK and iOS support
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" \
            -o renpy-sdk.tar.bz2
          curl -fL --retry 4 --retry-delay 5 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-renios.zip" \
            -o renios.zip
          tar -xjf renpy-sdk.tar.bz2
          rm -rf renios-extract
          mkdir renios-extract
          unzip -q renios.zip -d renios-extract

          RENIOS_ROOT="$PWD/renios-extract/renios"
          test -d "$RENIOS_ROOT/prototype"
          test -f "$RENIOS_ROOT/prototype/prototype.xcodeproj/project.pbxproj"
          echo "$RENIOS_ROOT" > "$RUNNER_TEMP/renios-root"
          echo "Renios runtime root: $RENIOS_ROOT"
          ls -lh renpy-sdk.tar.bz2 renios.zip

      - name: Create and populate iOS project with RenPy itself
        run: |
          set -euxo pipefail
          SDK="$GITHUB_WORKSPACE/renpy-${RENPY_VERSION}-sdk"

          # Use the current stable Ren'Py 8.5.3 SDK + matching Renios pair. The game's\n          # 8.5.0 bytecode remains within the 8.5 line, while 8.5.3 exposes the
          # performs BOTH renios.create.create_project() and the iOS-specific
          # Distributor(packages=['ios']) population pass. Do not hand-copy base/.
          rm -rf "$SDK/renios"
          cp -R renios-extract/renios "$SDK/renios"

          rm -rf ProjectOrchid-iOS
          test -d "$SDK/launcher"
          "$SDK/renpy.sh" "$SDK/launcher" ios_create "$GITHUB_WORKSPACE/recovered" "$GITHUB_WORKSPACE/ProjectOrchid-iOS"

          PBX="ProjectOrchid-iOS/ProjectOrchid.xcodeproj/project.pbxproj"
          if [ ! -f "$PBX" ]; then
            PBX="$(find ProjectOrchid-iOS -name project.pbxproj -print -quit)"
          fi
          test -n "$PBX"
          test -f "$PBX"

          # Rename only the generated Xcode project/target identifiers after
          # Ren'Py has completed its own packaging.
          OLDPROJ="$(dirname "$PBX")"
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace("XHTE5H7Z79","TEAMID")
          s=s.replace("org.renpy.prototype","com.generic.projectorchid")
          s=s.replace("prototype","ProjectOrchid")
          p.write_text(s)
          PY
          if [ "$(basename "$OLDPROJ")" != "ProjectOrchid.xcodeproj" ]; then
            mv "$OLDPROJ" ProjectOrchid-iOS/ProjectOrchid.xcodeproj
          fi

          test -f ProjectOrchid-iOS/base/main.py
          test -d ProjectOrchid-iOS/base/renpy
          test -d ProjectOrchid-iOS/base/game
          test -f ProjectOrchid-iOS/base/game/script_version.txt
          du -sh ProjectOrchid-iOS/base
          find ProjectOrchid-iOS/base -maxdepth 2 -type f | head -80

      - name: Set generic bundle identifier
        run: |
          set -euxo pipefail
          PBX="$(find ProjectOrchid-iOS -name project.pbxproj -print -quit)"
          test -n "$PBX"
          python3 - "$PBX" "${BUNDLE_ID}" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          bundle = sys.argv[2]
          s = p.read_text()
          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', s)
          p.write_text(s)
          PY
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX" | head

      - name: Discover scheme
        id: scheme
        run: |
          set -euxo pipefail
          PROJ="$(find ProjectOrchid-iOS -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          xcodebuild -project "$PROJ" -list
          SCHEME="$(xcodebuild -project "$PROJ" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          rm -rf build
          xcodebuild             -project "${{ steps.scheme.outputs.project }}"             -scheme "${{ steps.scheme.outputs.scheme }}"             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$PWD/build/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}"             build | tee xcodebuild.log

      - name: Validate built app runtime before packaging
        run: |
          set -euxo pipefail
          APP="$(find build/DerivedData/Build/Products -path '*Release-iphoneos/*.app' -type d -print -quit)"
          test -n "$APP"
          echo "Validating runtime payload in: $APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          echo "Bundle executable: $EXECUTABLE"
          test -x "$APP/$EXECUTABLE"
          test -f "$APP/base/main.py"
          test -f "$APP/base/renpy/__init__.py"
          test -f "$APP/base/game/script_version.txt"
          test -d "$APP/ios-python"
          test -d "$APP/lib"
          test -d "$APP/include"
          echo "Bundle size:"
          du -sh "$APP"
          echo "Critical runtime files:"
          ls -lh "$APP/base/main.py" "$APP/base/game/script_version.txt"
          find "$APP/ios-python" -maxdepth 2 -type f | head -30
          echo "Mach-O:"
          file "$APP/$EXECUTABLE"
          otool -L "$APP/$EXECUTABLE" | head -80

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$(find build/DerivedData/Build/Products -path '*Release-iphoneos/*.app' -type d -print -quit)"
          test -n "$APP"
          echo "Built app: $APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/${APP_NAME}.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "ipa/Payload/${APP_NAME}.app/Info.plist" || true
          ditto -c -k --sequesterRsrc --keepParent ipa/Payload ProjectOrchid.ipa.tmp.zip
          rm -f ProjectOrchid.ipa
          mv ProjectOrchid.ipa.tmp.zip ProjectOrchid.ipa
          ls -lh ProjectOrchid.ipa
          shasum -a 256 ProjectOrchid.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-iOS
          path: ProjectOrchid.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-build-diagnostics
          path: |
            xcodebuild.log
            ProjectOrchid-iOS/**/*.pbxproj
            recovered/game/script_version.txt
          if-no-files-found: ignore
