name: ProjectOrchid iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-watch:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: |
          set -euxo pipefail
          test -d /Applications/Xcode_15.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Build Series 3 companion
        working-directory: watch-companion
        run: |
          set -euxo pipefail
          xcodegen generate
          python3 - <<'PY'
          from pathlib import Path
          p=Path("OrchidWatch.xcodeproj/project.pbxproj"); s=p.read_text()
          if "objectVersion = 77;" in s: p.write_text(s.replace("objectVersion = 77;", "objectVersion = 56;", 1))
          PY
          xcodebuild -project OrchidWatch.xcodeproj -scheme OrchidWatch -configuration Release -sdk watchos -derivedDataPath "$GITHUB_WORKSPACE/build/WatchDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO WATCHOS_DEPLOYMENT_TARGET=8.0 build
          WATCHAPP="$(find "$GITHUB_WORKSPACE/build/WatchDerivedData/Build/Products" -path '*Release-watchos/OrchidWatch.app' -type d -print -quit)"
          test -n "$WATCHAPP"
          test -d "$WATCHAPP/PlugIns/OrchidWatchExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCHAPP/Info.plist")" = "com.generic.projectorchid"
          mkdir -p "$GITHUB_WORKSPACE/watch-payload"
          cp -R "$WATCHAPP" "$GITHUB_WORKSPACE/watch-payload/OrchidWatch.app"
      - name: Upload nested Watch app
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-Watch-Nested
          path: watch-payload
          include-hidden-files: true
          compression-level: 0

  build-ios:
    needs: build-watch
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DRIVE_FILE_ID: 1vRsZLlwYe-5SOkawJA-bGOnBe6gA56eA
      RENPY_VERSION: 8.5.3
      APP_NAME: ProjectOrchid
      BUNDLE_ID: com.generic.projectorchid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          sw_vers
          df -h

      - name: Restore cached source APK
        id: source-cache
        uses: actions/cache@v4
        with:
          path: source.apk
          key: orchid-source-apk-3d6d711f9111239a8069c6b7a070c1ba3a514a26570f6f689afe51892667e429

      - name: Download source APK on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/orchid-venv"
          "$RUNNER_TEMP/orchid-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/orchid-venv/bin/python" -m pip install gdown
          for attempt in 1 2 3 4; do
            "$RUNNER_TEMP/orchid-venv/bin/python" -m gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O source.apk && break
            echo "Drive download attempt $attempt failed"
            rm -f source.apk
            sleep $((attempt * 15))
          done
          test -s source.apk

      - name: Verify source APK
        run: |
          set -euxo pipefail
          test -s source.apk
          EXPECTED=3d6d711f9111239a8069c6b7a070c1ba3a514a26570f6f689afe51892667e429
          ACTUAL="$(shasum -a 256 source.apk | awk '{print $1}')"
          echo "source.apk SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          ls -lh source.apk

      - name: Recover RenPy game tree
        run: |
          set -euxo pipefail
          rm -rf recovered
          mkdir -p recovered/game
          unzip -q source.apk 'assets/x-game/*' -d apk-extract
          cp -R apk-extract/assets/x-game/. recovered/game/

          # Android's x-* asset packaging prefixes every path component.
          # Restore the original Ren'Py names from the leaves upward.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("recovered/game")
          paths = sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True)
          for p in paths:
              if p.name.startswith("x-"):
                  target = p.with_name(p.name[2:])
                  if target.exists():
                      raise SystemExit(f"Rename collision: {p} -> {target}")
                  p.rename(target)
          PY

          echo "Recovered files:"
          find recovered/game -type f | wc -l
          du -sh recovered/game
          test -f recovered/game/script_version.txt
          cat recovered/game/script_version.txt
          find recovered/game -name '*.rpyc' | head -30

      - name: Download matching RenPy SDK and iOS support
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" \
            -o renpy-sdk.tar.bz2
          curl -fL --retry 4 --retry-delay 5 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-renios.zip" \
            -o renios.zip
          tar -xjf renpy-sdk.tar.bz2
          rm -rf renios-extract
          mkdir renios-extract
          unzip -q renios.zip -d renios-extract

          RENIOS_ROOT="$PWD/renios-extract/renios"
          test -d "$RENIOS_ROOT/prototype"
          test -f "$RENIOS_ROOT/prototype/prototype.xcodeproj/project.pbxproj"
          echo "$RENIOS_ROOT" > "$RUNNER_TEMP/renios-root"
          echo "Renios runtime root: $RENIOS_ROOT"
          ls -lh renpy-sdk.tar.bz2 renios.zip

      - name: Create and populate iOS project with RenPy itself
        run: |
          set -euxo pipefail
          SDK="$GITHUB_WORKSPACE/renpy-${RENPY_VERSION}-sdk"

          # Use the current stable Ren'Py 8.5.3 SDK + matching Renios pair. The game's\n          # 8.5.0 bytecode remains within the 8.5 line, while 8.5.3 exposes the
          # performs BOTH renios.create.create_project() and the iOS-specific
          # Distributor(packages=['ios']) population pass. Do not hand-copy base/.
          rm -rf "$SDK/renios"
          cp -R renios-extract/renios "$SDK/renios"

          rm -rf ProjectOrchid-iOS
          test -d "$SDK/launcher"
          "$SDK/renpy.sh" "$SDK/launcher" ios_create "$GITHUB_WORKSPACE/recovered" "$GITHUB_WORKSPACE/ProjectOrchid-iOS"

          PBX="ProjectOrchid-iOS/ProjectOrchid.xcodeproj/project.pbxproj"
          if [ ! -f "$PBX" ]; then
            PBX="$(find ProjectOrchid-iOS -name project.pbxproj -print -quit)"
          fi
          test -n "$PBX"
          test -f "$PBX"

          # Rename only the generated Xcode project/target identifiers after
          # Ren'Py has completed its own packaging.
          OLDPROJ="$(dirname "$PBX")"
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace("XHTE5H7Z79","TEAMID")
          s=s.replace("org.renpy.prototype","com.generic.projectorchid")
          s=s.replace("prototype","ProjectOrchid")
          p.write_text(s)
          PY
          if [ "$(basename "$OLDPROJ")" != "ProjectOrchid.xcodeproj" ]; then
            mv "$OLDPROJ" ProjectOrchid-iOS/ProjectOrchid.xcodeproj
          fi

          test -f ProjectOrchid-iOS/base/main.py
          test -d ProjectOrchid-iOS/base/renpy
          test -d ProjectOrchid-iOS/base/game
          test -f ProjectOrchid-iOS/base/game/script_version.txt

          # Keep the known-good recovered game unmodified at startup. iPhone UI
          # adaptation will be reintroduced only after the baseline is reconfirmed.
          du -sh ProjectOrchid-iOS/base
          find ProjectOrchid-iOS/base -maxdepth 2 -type f | head -80

      - name: Set generic bundle identifier
        run: |
          set -euxo pipefail
          PBX="$(find ProjectOrchid-iOS -name project.pbxproj -print -quit)"
          test -n "$PBX"
          python3 - "$PBX" "${BUNDLE_ID}" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          bundle = sys.argv[2]
          s = p.read_text()
          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', s)
          p.write_text(s)
          PY
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX" | head

      - name: Discover scheme
        id: scheme
        run: |
          set -euxo pipefail
          PROJ="$(find ProjectOrchid-iOS -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJ"
          xcodebuild -project "$PROJ" -list
          SCHEME="$(xcodebuild -project "$PROJ" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          rm -rf build
          xcodebuild             -project "${{ steps.scheme.outputs.project }}"             -scheme "${{ steps.scheme.outputs.scheme }}"             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$PWD/build/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}"             build | tee xcodebuild.log

      - name: Download validated Series 3 companion
        uses: actions/download-artifact@v4
        with:
          name: ProjectOrchid-Watch-Nested
          path: watch-nested

      - name: Embed Series 3 companion into iPhone app
        run: |
          set -euxo pipefail
          APP="$(find build/DerivedData/Build/Products -path '*Release-iphoneos/*.app' -type d -print -quit)"
          echo "Downloaded Watch artifact layout:"
          find watch-nested -maxdepth 4 -print | sort | head -150
          WATCHAPP="$(find watch-nested -name 'OrchidWatch.app' -type d -print -quit)"
          if [ -z "$WATCHAPP" ] && [ -f watch-nested/Info.plist ] && [ -d watch-nested/PlugIns/OrchidWatchExtension.appex ]; then
            WATCHAPP="$PWD/watch-nested"
          fi
          test -n "$APP"
          test -n "$WATCHAPP"
          test -d "$WATCHAPP/PlugIns/OrchidWatchExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCHAPP/Info.plist")" = "$BUNDLE_ID"
          rm -rf "$APP/Watch"
          mkdir -p "$APP/Watch"
          cp -R "$WATCHAPP" "$APP/Watch/OrchidWatch.app"

          # Validate the exact companion relationship iOS uses for Watch discovery.
          WATCH="$APP/Watch/OrchidWatch.app"
          EXT="$WATCH/PlugIns/OrchidWatchExtension.appex"
          test -d "$EXT"
          IOS_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          WATCH_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH/Info.plist")"
          COMPANION_ID="$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH/Info.plist")"
          EXT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          WKAPP_ID="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:WKAppBundleIdentifier' "$EXT/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :NSExtension:WKAppBundleIdentifier' "$EXT/Info.plist" 2>/dev/null || true)"
          echo "iOS=$IOS_ID Watch=$WATCH_ID Companion=$COMPANION_ID Extension=$EXT_ID WKApp=$WKAPP_ID"
          test "$COMPANION_ID" = "$IOS_ID"
          test "$WATCH_ID" = "$IOS_ID.watchkitapp"
          test "$EXT_ID" = "$WATCH_ID.watchkitextension"
          test "$WKAPP_ID" = "$WATCH_ID"

          # Do not permit the companion to be marked watch-only.
          WATCH_ONLY="$(/usr/libexec/PlistBuddy -c 'Print :WKWatchOnly' "$WATCH/Info.plist" 2>/dev/null || echo false)"
          test "$WATCH_ONLY" != "true"
          find "$APP/Watch" -maxdepth 4 -print | sort | head -150

      - name: Validate built app runtime before packaging
        run: |
          set -euxo pipefail
          APP="$(find build/DerivedData/Build/Products -path '*Release-iphoneos/*.app' -type d -print -quit)"
          test -n "$APP"
          echo "Validating runtime payload in: $APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          echo "Bundle executable: $EXECUTABLE"
          test -x "$APP/$EXECUTABLE"
          test -f "$APP/base/main.py"
          if test -d "$APP/base/renpy"; then
            echo "RenPy engine is bundled under base/renpy"
          elif test -d "$APP/renpy"; then
            echo "RenPy engine is bundled under top-level renpy"
          elif find "$APP" -maxdepth 4 -type f \( -name "renpy.py" -o -name "__init__.py" \) | grep -q .; then
            echo "RenPy Python payload detected elsewhere in official ios_create bundle"
          else
            echo "ERROR: no RenPy Python payload found"
            find "$APP" -maxdepth 3 -type d | sort | head -200
            exit 1
          fi
          test -f "$APP/base/game/script_version.txt"
          test -d "$APP/base/lib"
          test -d "$APP/base/lib/python3.12"
          test -d "$APP/Watch/OrchidWatch.app"
          test -d "$APP/Watch/OrchidWatch.app/PlugIns/OrchidWatchExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$APP/Watch/OrchidWatch.app/Info.plist")" = "$BUNDLE_ID"
          echo "Top-level app payload:"
          find "$APP" -maxdepth 2 -mindepth 1 -print | sort | head -250
          echo "Python/runtime candidates:"
          find "$APP" -maxdepth 4 \( -iname "*python*" -o -iname "*renpy*" \) -print | sort | head -250
          echo "Bundle size:"
          du -sh "$APP"
          echo "Critical runtime files:"
          ls -lh "$APP/base/main.py" "$APP/base/game/script_version.txt"
          find "$APP/base/lib/python3.12" -maxdepth 2 -type f -print > "$RUNNER_TEMP/python-runtime-files.txt"
          head -30 "$RUNNER_TEMP/python-runtime-files.txt"
          echo "Mach-O:"
          file "$APP/$EXECUTABLE"
          otool -L "$APP/$EXECUTABLE" | head -80

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$(find build/DerivedData/Build/Products -path '*Release-iphoneos/*.app' -type d -print -quit)"
          test -n "$APP"
          echo "Built app: $APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" "ipa/Payload/${APP_NAME}.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "ipa/Payload/${APP_NAME}.app/Info.plist" || true
          # IPA is a ZIP whose archive root must contain Payload/, not an
          # additional parent directory. Use zip directly for maximum
          # compatibility with on-device signing/extraction apps.
          rm -f ProjectOrchid.ipa
          (
            cd ipa
            /usr/bin/zip -qry -X "$GITHUB_WORKSPACE/ProjectOrchid.ipa" Payload
          )

          # Validate the exact archive structure before upload.
          unzip -t ProjectOrchid.ipa
          # Validate with Python's ZIP parser to avoid BSD awk/grep and pipefail differences.
          python3 - <<'PY'
          import zipfile
          p = "ProjectOrchid.ipa"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
          apps = sorted({n.split("/", 2)[1] for n in names
                         if n.startswith("Payload/") and len(n.split("/", 2)) >= 2
                         and n.split("/", 2)[1].endswith(".app")})
          payload = [n for n in names if n.startswith("Payload/")]
          if len(apps) != 1:
              raise SystemExit(f"ERROR: expected exactly one app under Payload, found: {apps}")
          if len(payload) <= 10:
              raise SystemExit(f"ERROR: suspiciously small Payload: {len(payload)} entries")
          if any(n.startswith("ipa/") for n in names):
              raise SystemExit("ERROR: invalid extra ipa/ root directory")
          print("IPA root app: Payload/" + apps[0] + "/")
          print("IPA entries:", len(names), "Payload entries:", len(payload))
          print("\\n".join(names[:40]))
          PY
          ls -lh ProjectOrchid.ipa
          shasum -a 256 ProjectOrchid.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-iOS
          path: ProjectOrchid.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-build-diagnostics
          path: |
            xcodebuild.log
            ProjectOrchid-iOS/**/*.pbxproj
            recovered/game/script_version.txt
          if-no-files-found: ignore
