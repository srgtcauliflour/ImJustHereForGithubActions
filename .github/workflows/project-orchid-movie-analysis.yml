name: ProjectOrchid Movie Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse-story:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE_FILE_ID: 1vRsZLlwYe-5SOkawJA-bGOnBe6gA56eA
    steps:
      - uses: actions/checkout@v4

      - name: Download and reconstruct game
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/movie-venv"
          "$RUNNER_TEMP/movie-venv/bin/pip" install --upgrade pip gdown
          "$RUNNER_TEMP/movie-venv/bin/python" -m gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O source.apk
          mkdir -p recovered/game
          unzip -q source.apk 'assets/x-game/*' -d apk-extract
          cp -R apk-extract/assets/x-game/. recovered/game/
          python3 - <<'PY'
          from pathlib import Path
          root=Path("recovered/game")
          for p in sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True):
              if p.name.startswith("x-"):
                  q=p.with_name(p.name[2:])
                  if q.exists(): raise SystemExit(f"collision: {p} -> {q}")
                  p.rename(q)
          PY

      - name: Decompile RenPy 8.5 story scripts
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.2.0 https://github.com/cnfatal/rpycdec.git rpycdec
          "$RUNNER_TEMP/movie-venv/bin/pip" install ./rpycdec
          mkdir -p movie-analysis/decompiled
          # Decompile all scripts, not only story/. The story graph calls helper
          # labels defined elsewhere (profiles/update/replay etc.), and image/audio
          # definitions outside story are required to resolve indirect media.
          cp -R recovered/game/scripts movie-analysis/decompiled/scripts
          "$RUNNER_TEMP/movie-venv/bin/rpycdec" decompile movie-analysis/decompiled/scripts

      - name: Build branch graph and media manifest
        run: |
          set -euxo pipefail
          mkdir -p movie-analysis
          cat > "$RUNNER_TEMP/analyse.py" <<'PY'
          from pathlib import Path
          import re, json, csv
          root=Path("movie-analysis/decompiled/scripts")
          files=sorted(root.rglob("*.rpy"))
          story_files=[p for p in files if "story" in p.parts]
          label_re=re.compile(r'^\s*label\s+([^\s(:]+)')
          jump_re=re.compile(r'^\s*(jump|call)\s+([^\s(]+)')
          menu_re=re.compile(r'^\s*menu(?:\s+[^:]*)?:\s*$')
          choice_re=re.compile(r'^\s*"((?:[^"\\]|\\.)*)"\s*(?:if\s+.*?)?:\s*$')
          media_re=re.compile(r'["\']([^"\']+\.(?:webp|png|jpg|jpeg|webm|mp4|mp3|ogg|opus|wav))["\']', re.I)
          labels={}; edges=[]; menus=[]; media=[]; current=None
          for fn in files:
              lines=fn.read_text(errors="replace").splitlines()
              in_menu=False; menu_indent=None; menu_label=None
              for n,line in enumerate(lines,1):
                  indent=len(line)-len(line.lstrip())
                  m=label_re.match(line)
                  if m:
                      current=m.group(1); labels[current]={"file":str(fn),"line":n}
                  j=jump_re.match(line)
                  if j and current:
                      edges.append({"from":current,"to":j.group(2),"kind":j.group(1),"file":str(fn),"line":n})
                  if menu_re.match(line):
                      in_menu=True; menu_indent=indent; menu_label=current
                  elif in_menu and line.strip() and indent<=menu_indent:
                      in_menu=False
                  if in_menu:
                      ch=choice_re.match(line)
                      if ch:
                          menus.append({"label":menu_label,"choice":ch.group(1),"file":str(fn),"line":n})
                  for mm in media_re.finditer(line):
                      media.append({"label":current,"path":mm.group(1),"file":str(fn),"line":n})
          incoming={k:0 for k in labels}; outgoing={k:0 for k in labels}
          for e in edges:
              if e["to"] in incoming: incoming[e["to"]]+=1
              if e["from"] in outgoing: outgoing[e["from"]]+=1
          report={
            "script_files":len(files),"story_script_files":len(story_files),"labels":len(labels),"explicit_edges":len(edges),
            "menus":len(menus),"media_references":len(media),
            "branch_labels":[k for k,v in outgoing.items() if v>1],
            "unresolved_targets":sorted({e["to"] for e in edges if e["to"] not in labels})
          }
          Path("movie-analysis/summary.json").write_text(json.dumps(report,indent=2))
          Path("movie-analysis/labels.json").write_text(json.dumps(labels,indent=2))
          for name,rows in [("edges.csv",edges),("choices.csv",menus),("media.csv",media)]:
              with open("movie-analysis/"+name,"w",newline="") as f:
                  if rows:
                      w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          md=["# ProjectOrchid Movie Story Analysis","",f"- Decompiled scripts: {len(files)}",f"- Story scripts: {len(story_files)}",f"- Labels: {len(labels)}",f"- Explicit jump/call edges: {len(edges)}",f"- Menu choices: {len(menus)}",f"- Media references in story scripts: {len(media)}",f"- Unresolved explicit targets: {len(report['unresolved_targets'])}","","## Choices"]
          md += [f"- **{x['label']}** — {x['choice']} ({Path(x['file']).name}:{x['line']})" for x in menus]
          md += ["","## Unresolved targets"]+[f"- {x}" for x in report["unresolved_targets"]]
          Path("movie-analysis/REPORT.md").write_text("\n".join(md))
          print(json.dumps(report,indent=2))

          # Produce a second-pass shortlist of choices that are likely to matter
          # to a linear main-film route. This is deliberately conservative:
          # choices are retained for editorial review rather than auto-selected.
          by_label={}
          for m in menus: by_label.setdefault(m["label"],[]).append(m)
          critical=[]
          for label,items in by_label.items():
              outs=[e for e in edges if e["from"]==label]
              targets=sorted({e["to"] for e in outs})
              critical.append({
                  "label":label,
                  "choices":[i["choice"] for i in items],
                  "explicit_targets":targets,
                  "choice_count":len(items),
                  "target_count":len(targets),
                  "likely_story_altering": len(targets)>1,
              })
          # Third pass: quantify whether branches quickly reconverge. This is
          # the useful distinction for the film: a menu can jump to different
          # labels without creating a materially different storyline.
          graph={}
          for e in edges:
              if e["to"] in labels:
                  graph.setdefault(e["from"],set()).add(e["to"])

          def distances(start,limit=80):
              d={start:0}; q=[start]
              for n in q:
                  if d[n] >= limit: continue
                  for nxt in graph.get(n,()):
                      if nxt not in d:
                          d[nxt]=d[n]+1; q.append(nxt)
              return d

          for row in critical:
              ts=row["explicit_targets"]
              row["reconverges"]=None
              row["reconvergence_label"]=None
              row["reconvergence_depth"]=None
              row["unique_label_counts"]={}
              if len(ts)>=2 and all(t in labels for t in ts):
                  ds=[distances(t) for t in ts]
                  common=set(ds[0])
                  for d in ds[1:]: common &= set(d)
                  common -= set(ts)
                  if common:
                      meet=min(common,key=lambda n:(max(d[n] for d in ds),sum(d[n] for d in ds),n))
                      depth=max(d[meet] for d in ds)
                      row["reconverges"]=True
                      row["reconvergence_label"]=meet
                      row["reconvergence_depth"]=depth
                      for t,d in zip(ts,ds):
                          row["unique_label_counts"][t]=sum(1 for n,dd in d.items() if dd < d[meet] and n not in common)
                  else:
                      row["reconverges"]=False

          Path("movie-analysis/choice-review.json").write_text(json.dumps(critical,indent=2))
          film_candidates=[x for x in critical if x["target_count"]>1 and (x["reconverges"] is False or (x["reconvergence_depth"] or 0)>4)]
          Path("movie-analysis/film-critical-choices.json").write_text(json.dumps(film_candidates,indent=2))
          print("Choice groups:",len(critical))
          print("Likely story-altering groups:",sum(1 for x in critical if x["likely_story_altering"]))
          print("Film-critical candidates after convergence analysis:",len(film_candidates))

          # Build an editorial skeleton for the first linear film. We preserve
          # chapter/version order and structural branch information, while
          # deliberately leaving route selection unresolved until candidate
          # branches have been compared for continuity and pacing.
          import re
          story_labels=[]
          for name,meta in labels.items():
              fp=Path(meta["file"])
              if "story" not in fp.parts: continue
              m=re.search(r'v(\\d{2})',fp.stem.lower())
              chapter=int(m.group(1)) if m else 0
              story_labels.append({"chapter":chapter,"label":name,"file":str(fp),"line":meta["line"]})
          story_labels.sort(key=lambda x:(x["chapter"],x["file"],x["line"]))
          critical_names={x["label"] for x in film_candidates}
          chapters=[]
          for chapter in sorted({x["chapter"] for x in story_labels}):
              rows=[x for x in story_labels if x["chapter"]==chapter]
              chapters.append({
                  "chapter":chapter,
                  "entry_label":rows[0]["label"] if rows else None,
                  "labels":[x["label"] for x in rows],
                  "film_critical_choice_labels":[x["label"] for x in rows if x["label"] in critical_names],
              })
          skeleton={
              "format":"ProjectOrchid main-film editorial skeleton v1",
              "principles":[
                  "preserve chronological chapter order",
                  "prefer branches that maintain narrative continuity",
                  "remove gameplay-only detours and rapidly reconverging choices",
                  "retain unique consequential scenes when they materially affect later story",
                  "pace dialogue faster than gameplay while preserving comprehension",
                  "treat repeated video loops as edited montage material"
              ],
              "chapters":chapters,
          }
          Path("movie-analysis/main-film-skeleton.json").write_text(json.dumps(skeleton,indent=2))
          md=["# Main Film Structure (draft)","",
              "This is an editorial skeleton, not a final route selection.",
              "Branches remain unresolved until convergence and downstream impact are reviewed.",""]
          for ch in chapters:
              md += [f"## Chapter {ch['chapter']:02d}",
                     f"- Entry: {ch['entry_label']}",
                     f"- Structural labels: {len(ch['labels'])}",
                     f"- Film-critical choice candidates: {len(ch['film_critical_choice_labels'])}",""]
          Path("movie-analysis/MAIN_FILM_STRUCTURE.md").write_text("\\n".join(md))

          # Fourth pass: enrich the 13 film-critical candidates with downstream
          # impact. This gives the editor evidence for selecting the linear route
          # without simply preferring the longest branch.
          media_by_label={}
          for m in media:
              media_by_label.setdefault(m["label"],set()).add(m.get("path") or m.get("media") or m.get("ref") or str(m))
          def reachable(start,limit=160):
              d=distances(start,limit)
              return set(d)
          enriched=[]
          for row in film_candidates:
              ts=row["explicit_targets"]
              reach={t:reachable(t) for t in ts if t in labels}
              union=set().union(*reach.values()) if reach else set()
              common=set.intersection(*reach.values()) if reach else set()
              branch_data=[]
              for t,nodes in reach.items():
                  unique=nodes-common
                  refs=set()
                  for n in nodes: refs |= media_by_label.get(n,set())
                  unique_refs=set()
                  for n in unique: unique_refs |= media_by_label.get(n,set())
                  branch_data.append({
                      "target":t,
                      "reachable_labels":len(nodes),
                      "exclusive_labels":len(unique),
                      "reachable_media":len(refs),
                      "exclusive_media":len(unique_refs),
                      "sample_exclusive_labels":sorted(unique)[:20],
                  })
              enriched.append({
                  **row,
                  "downstream_union_labels":len(union),
                  "downstream_common_labels":len(common),
                  "branches":branch_data,
              })
          Path("movie-analysis/film-critical-impact.json").write_text(json.dumps(enriched,indent=2))

          # Editorial classification: keep consequential branches for route
          # selection, flag small-but-unique branches as montage/optional-scene
          # candidates, and identify effectively equivalent choices.
          route=[]; optional=[]; equivalent=[]
          for row in enriched:
              b=row["branches"]
              max_unique=max([x["exclusive_labels"] for x in b] or [0])
              max_media=max([x["exclusive_media"] for x in b] or [0])
              depth=row.get("reconvergence_depth") or 999
              if row.get("reconverges") and depth <= 6 and max_unique <= 3:
                  (optional if max_media else equivalent).append(row)
              else:
                  route.append(row)
          classification={
              "route_decisions":route,
              "optional_scene_candidates":optional,
              "effectively_equivalent":equivalent,
          }
          Path("movie-analysis/editorial-classification.json").write_text(json.dumps(classification,indent=2))
          print("Editorial route decisions:",len(route))
          print("Optional scene candidates:",len(optional))
          print("Effectively equivalent choices:",len(equivalent))

          # Fifth pass: generate a deterministic draft route-selection dossier.
          # This does NOT pretend to understand prose semantically; it ranks
          # structural continuity and retained unique media so the next pass can
          # make an evidence-backed editorial selection.
          route_dossier=[]
          for row in enriched:
              scored=[]
              for b in row["branches"]:
                  # Prefer continuity/coverage while giving unique visual
                  # material a modest bonus. Keep component scores transparent.
                  continuity=b["reachable_labels"]
                  narrative=b["exclusive_labels"]
                  visual=b["exclusive_media"]
                  score=continuity + narrative*2 + visual*3
                  scored.append({**b,"structural_score":score})
              scored.sort(key=lambda x:(-x["structural_score"],x["target"]))
              route_dossier.append({
                  "choice_label":row["label"],
                  "reconverges":row.get("reconverges"),
                  "reconvergence_label":row.get("reconvergence_label"),
                  "candidates":scored,
                  "draft_structural_pick":scored[0]["target"] if scored else None,
                  "status":"requires editorial story review",
              })
          Path("movie-analysis/main-route-dossier.json").write_text(json.dumps(route_dossier,indent=2))

          # Produce the first timeline manifest schema. At this stage entries are
          # chapter/label structural beats; subsequent passes resolve each beat
          # to images/video/audio/dialogue and concrete durations.
          timeline=[]
          order=0
          for ch in chapters:
              for label in ch["labels"]:
                  order+=1
                  timeline.append({
                      "order":order,
                      "chapter":ch["chapter"],
                      "label":label,
                      "route_decision":label in {x["choice_label"] for x in route_dossier},
                      "visuals":[],
                      "audio":[],
                      "dialogue":[],
                      "duration_seconds":None,
                      "editorial_status":"structural",
                  })
          Path("movie-analysis/main-film-timeline.json").write_text(json.dumps({
              "version":1,
              "status":"structural draft",
              "entries":timeline,
          },indent=2))
          print("Main-route dossiers:",len(route_dossier))
          print("Structural timeline entries:",len(timeline))

          # Sixth pass: resolve literal media references onto structural beats
          # and assign first-pass screen-time estimates. Dialogue extraction is
          # intentionally conservative; this stage makes the timeline render-
          # oriented without inventing content that is not in the scripts.
          timeline_by_label={x["label"]:x for x in timeline}
          for m in media:
              e=timeline_by_label.get(m["label"])
              if not e: continue
              ref=m.get("path") or m.get("media") or m.get("ref")
              if not ref: continue
              low=str(ref).lower()
              if low.endswith((".mp3",".ogg",".opus",".wav")):
                  e["audio"].append(ref)
              else:
                  e["visuals"].append(ref)
          for e in timeline:
              e["visuals"]=list(dict.fromkeys(e["visuals"]))
              e["audio"]=list(dict.fromkeys(e["audio"]))
              videos=[x for x in e["visuals"] if str(x).lower().endswith((".webm",".mp4"))]
              stills=[x for x in e["visuals"] if x not in videos]
              # Editing baseline only; actual durations will later be replaced
              # by dialogue/audio/video-aware timing.
              if videos:
                  e["duration_seconds"]=max(6, len(videos)*3)
                  e["webm_cycle_minimum"]=3
              elif stills:
                  e["duration_seconds"]=max(3, min(12, len(stills)*2.5))
              else:
                  e["duration_seconds"]=2
              e["editorial_status"]="media-resolved" if e["visuals"] or e["audio"] else "structural"
          total=sum(e["duration_seconds"] for e in timeline)
          Path("movie-analysis/main-film-timeline.json").write_text(json.dumps({
              "version":2,
              "status":"media-resolved structural draft",
              "estimated_runtime_seconds":total,
              "entries":timeline,
          },indent=2))
          Path("movie-analysis/media-resolved-summary.json").write_text(json.dumps({
              "timeline_entries":len(timeline),
              "entries_with_visuals":sum(bool(e["visuals"]) for e in timeline),
              "entries_with_audio":sum(bool(e["audio"]) for e in timeline),
              "estimated_runtime_seconds":total,
          },indent=2))
          print("Timeline entries with visuals:",sum(bool(e["visuals"]) for e in timeline))
          print("Timeline entries with audio:",sum(bool(e["audio"]) for e in timeline))
          print("First-pass runtime seconds:",total)
          PY
          python3 "$RUNNER_TEMP/analyse.py"
          python3 tools/orchid_dialogue_timing.py movie-analysis recovered/game
          python3 tools/orchid_event_resolver.py movie-analysis
          python3 tools/orchid_asset_resolver.py movie-analysis recovered/game

      - name: Upload movie analysis
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrchid-Movie-Analysis
          path: movie-analysis/
          retention-days: 30
