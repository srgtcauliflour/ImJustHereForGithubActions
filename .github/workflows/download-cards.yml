name: Download Pokemon Card Images
on:
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python download_cards.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-30th-Anniversary-Cards
          path: Pokemon-30th-Anniversary-Cards.zip
          if-no-files-found: error
